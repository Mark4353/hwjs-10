<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

    <div class="box"></div>

    <p>Час: <span id="time" class="time">10</span> сек</p>
    <p>Очки: <span class="score" id="score">0</span></p>
    
    <button id="start" class="start">Почати гру</button>
    <div class="gameArea"  id="gameArea">

        <div id="target" class="target"></div>

    </div>

    <label for="timeInput">Введіть час :</label>
    <input type="number" class="timeInput" min="1">
    <button class="setTime">Запустити</button>
    <p class="message"></p>

    <script src="./main.js"></script>
</body>
</html>
